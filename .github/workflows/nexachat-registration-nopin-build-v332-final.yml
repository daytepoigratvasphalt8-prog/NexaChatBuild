name: Build NexaChat Registration No PIN Final

on:
  push:
    paths:
      - "nexachat-registration-nopin-source-v332-final.zip"
      - ".github/workflows/nexachat-registration-nopin-build-v332-final.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexachat-3.3.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f nexachat-registration-nopin-source-v332-final.zip
          unzip -tq nexachat-registration-nopin-source-v332-final.zip
          sha256sum nexachat-registration-nopin-source-v332-final.zip

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/nexachat-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q nexachat-registration-nopin-source-v332-final.zip -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify-static.sh tools/generate_offline_pack.py
          ./tools/verify-static.sh

      - name: Generate wallpaper pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_offline_pack.py | tee power-pack.log

      - name: Run tests and build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug 2>&1 | tee build.log

          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" nexachat-registration-nopin-v332-final-debug.apk
          sha256sum nexachat-registration-nopin-v332-final-debug.apk > nexachat-registration-nopin-v332-final-debug.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose nexachat-registration-nopin-v332-final-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexachat-registration-nopin-v332-final-APK
          path: |
            nexachat-registration-nopin-v332-final-debug.apk
            nexachat-registration-nopin-v332-final-debug.apk.sha256
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

      - name: Run Android lint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee -a build.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexachat-registration-nopin-v332-final-reports
          path: |
            build.log
            power-pack.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

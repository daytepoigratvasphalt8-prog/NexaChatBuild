name: Build NexaChat 3.4.2 Phone APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NexaChat-3.4.2-Phone-source.zip"
      - ".github/workflows/NexaChat-3.4.2-Phone-build.yml"

permissions:
  contents: read

concurrency:
  group: nexachat-3.4.2-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    name: Build debug APK without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SOURCE_ARCHIVE: NexaChat-3.4.2-Phone-source.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ARCHIVE"
          unzip -tq "$SOURCE_ARCHIVE"
          rm -rf "$RUNNER_TEMP/nexachat-source"
          mkdir -p "$RUNNER_TEMP/nexachat-source"
          unzip -q "$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/nexachat-source"
          SETTINGS="$(find "$RUNNER_TEMP/nexachat-source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f tools/generate_feature_pack.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feature-pack generator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pillow==12.2.0" "numpy==2.3.5"

      - name: Generate built-in wallpapers and stickers
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/generate_feature_pack.py
          python tools/generate_feature_pack.py | tee feature-pack.log
          test "$(find app/src/main/assets/nexa_pack/wallpapers -name 'wallpaper_*.jpg' | wc -l)" -eq 60
          test "$(find app/src/main/assets/nexa_pack/stickers -name 'sticker_*.png' | wc -l)" -eq 180
          test ! -d app/src/main/assets/nexa_pack/sounds
          du -sh app/src/main/assets/nexa_pack

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify-static.sh
          ./tools/verify-static.sh

      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug 2>&1 | tee build.log

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" NexaChat-3.4.2-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose NexaChat-3.4.2-debug.apk
          sha256sum NexaChat-3.4.2-debug.apk > NexaChat-3.4.2-debug.apk.sha256
          du -h NexaChat-3.4.2-debug.apk | tee size-report.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.4.2-debug-APK
          path: |
            NexaChat-3.4.2-debug.apk
            NexaChat-3.4.2-debug.apk.sha256
            size-report.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Run Android lint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee lint.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.4.2-debug-reports
          path: |
            build.log
            lint.log
            feature-pack.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

name: Build NexaChat 3.1 Crystal Glass

on:
  push:
    branches: [main]
    paths:
      - "NexaChat-v3.1-crystal-source.zip"
      - ".github/workflows/build-nexachat-3.1-crystal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f NexaChat-v3.1-crystal-source.zip
          echo "59e1f9ee30dec3634a0a465d1d874c3d25a39221c3ec9de25990cad006c053d2  NexaChat-v3.1-crystal-source.zip" | sha256sum --check --strict

      - name: Unpack NexaChat 3.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexachat-31
          mkdir -p /tmp/nexachat-31
          unzip -q NexaChat-v3.1-crystal-source.zip -d /tmp/nexachat-31
          chmod -R u+rwX,go+rX /tmp/nexachat-31/NexaChat-v3.1-crystal
          cp -R /tmp/nexachat-31/NexaChat-v3.1-crystal/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -nE 'compileSdk|targetSdk|versionName' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Static verification
        shell: bash
        run: |
          chmod +x gradlew tools/verify-static.sh
          ./tools/verify-static.sh

      - name: Unit tests and APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NexaChat-3.1-Crystal-Glass-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose NexaChat-3.1-Crystal-Glass-debug.apk
          sha256sum NexaChat-3.1-Crystal-Glass-debug.apk | tee NexaChat-3.1-Crystal-Glass-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.1-Crystal-Glass-APK
          path: |
            NexaChat-3.1-Crystal-Glass-debug.apk
            NexaChat-3.1-Crystal-Glass-debug.apk.sha256
          if-no-files-found: error
          retention-days: 21

      - name: Android lint report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee -a build.log

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.1-build-reports
          path: |
            build.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

name: Build NexaChat 3.0.2 APK FINAL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nexachat-3.0.2-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify and unpack existing source
        shell: bash
        run: |
          set -euo pipefail
          test -f NexaChat-v3.0.2-glass-source.zip
          echo "4b0a0bf12e0549bb2198cf46a2cc6cd1a3043577177b87cba562cbb6d75e8e65  NexaChat-v3.0.2-glass-source.zip" | sha256sum --check --strict
          rm -rf /tmp/nexachat-final
          mkdir -p /tmp/nexachat-final
          unzip -q NexaChat-v3.0.2-glass-source.zip -d /tmp/nexachat-final
          chmod -R u+rwX,go+rX /tmp/nexachat-final/NexaChat-v3.0.2-glass
          cp -R /tmp/nexachat-final/NexaChat-v3.0.2-glass/. .
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NexaChat-3.0.2-Liquid-Glass-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.0.2-Liquid-Glass-APK-FINAL
          path: NexaChat-3.0.2-Liquid-Glass-debug.apk
          if-no-files-found: error
          retention-days: 21

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.0.2-final-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

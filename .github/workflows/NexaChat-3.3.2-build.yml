name: Build NexaChat 3.3.2 Registration No PIN

on:
  push:
    branches: [main]
    paths:
      - "NexaChat-v3.3.2-chat-fix-source.zip"
      - ".github/workflows/build-nexachat-3.3.2-chat-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-registration-no-pin-apk
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f NexaChat-v3.3.2-chat-fix-source.zip
          echo "328a395d4db14392bd22954030b14e1612f350aead5ac7c5036337dba0a195bc  NexaChat-v3.3.2-chat-fix-source.zip" | sha256sum --check --strict

      - name: Unpack NexaChat 3.3.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexachat-332
          mkdir -p /tmp/nexachat-332
          unzip -q NexaChat-v3.3.2-chat-fix-source.zip -d /tmp/nexachat-332
          chmod -R u+rwX,go+rX /tmp/nexachat-332/NexaChat-v3.3.2-chat-fix
          cp -R /tmp/nexachat-332/NexaChat-v3.3.2-chat-fix/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -nE 'compileSdk|targetSdk|versionName' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Static verification
        shell: bash
        run: |
          chmod +x gradlew tools/verify-static.sh tools/generate_offline_pack.py
          ./tools/verify-static.sh
          grep -q '"orderBy" to JSONObject.quote("createdAt")'             app/src/main/java/com/nexachat/app/core/repository/ChatRepository.kt
          grep -q 'legacyMessageJson(pending)'             app/src/main/java/com/nexachat/app/core/repository/ChatRepository.kt

      - name: Generate 100 MiB wallpaper pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_offline_pack.py | tee power-pack.log
          test "$(find app/src/main/assets/nexa_pack/wallpapers -type f -name '*.bmp' | wc -l)" -eq 40
          PACK_BYTES=$(du -sb app/src/main/assets/nexa_pack | cut -f1)
          echo "Power Pack bytes: $PACK_BYTES"
          test "$PACK_BYTES" -ge 120586240

      - name: Unit tests and APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NexaChat-3.3.2-Registration-No-PIN-debug.apk

          APK_BYTES=$(stat -c%s NexaChat-3.3.2-Registration-No-PIN-debug.apk)
          APK_MIB=$(awk "BEGIN { printf \"%.2f\", $APK_BYTES / 1048576 }")
          echo "Final APK size: $APK_MIB MiB ($APK_BYTES bytes)"
          if [ "$APK_BYTES" -lt 104857600 ]; then
            echo "APK is below the required 100 MiB minimum" >&2
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose NexaChat-3.3.2-Registration-No-PIN-debug.apk
          sha256sum NexaChat-3.3.2-Registration-No-PIN-debug.apk | tee NexaChat-3.3.2-Registration-No-PIN-debug.apk.sha256
          printf '%s MiB\n' "$APK_MIB" > NexaChat-3.3.2-Registration-No-PIN-size.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.3.2-Registration-No-PIN-APK
          path: |
            NexaChat-3.3.2-Registration-No-PIN-debug.apk
            NexaChat-3.3.2-Registration-No-PIN-debug.apk.sha256
            NexaChat-3.3.2-Registration-No-PIN-size.txt
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

      - name: Android lint report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee -a build.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.3.2-registration-build-reports
          path: |
            build.log
            power-pack.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

name: Build and Deploy NexaChat 3.4.1 Secure

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy Cloud Functions and Firebase rules before building
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nexachat-3.4.1-secure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_backend:
    name: Deploy Firebase backend
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_ARCHIVE: NexaChat-3.4.1-Secure-source.zip
      NEXA_PROJECT_ID: ${{ secrets.NEXA_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ARCHIVE"
          unzip -tq "$SOURCE_ARCHIVE"
          rm -rf "$RUNNER_TEMP/nexachat-source"
          mkdir -p "$RUNNER_TEMP/nexachat-source"
          unzip -q "$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/nexachat-source"
          SETTINGS="$(find "$RUNNER_TEMP/nexachat-source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXA_PROJECT_ID"
          test -n "$FIREBASE_SERVICE_ACCOUNT_BASE64"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-audit --no-fund
          npm install --global firebase-tools
          npm --prefix functions run check

      - name: Authenticate Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$CREDENTIALS"
          python3 -m json.tool "$CREDENTIALS" >/dev/null
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"

      - name: Deploy functions and security rules
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only functions,database,storage \
            --project "$NEXA_PROJECT_ID" \
            --non-interactive

  build_release:
    name: Build signed release APK and AAB
    needs: deploy_backend
    if: ${{ always() && (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SOURCE_ARCHIVE: NexaChat-3.4.1-Secure-source.zip
      NEXA_FIREBASE_API_KEY: ${{ secrets.NEXA_FIREBASE_API_KEY }}
      NEXA_DATABASE_URL: ${{ secrets.NEXA_DATABASE_URL }}
      NEXA_PROJECT_ID: ${{ secrets.NEXA_PROJECT_ID }}
      NEXA_STORAGE_BUCKET: ${{ secrets.NEXA_STORAGE_BUCKET }}
      NEXA_FIREBASE_APP_ID: ${{ secrets.NEXA_FIREBASE_APP_ID }}
      NEXA_FIREBASE_SENDER_ID: ${{ secrets.NEXA_FIREBASE_SENDER_ID }}
      NEXA_FUNCTIONS_BASE_URL: ${{ secrets.NEXA_FUNCTIONS_BASE_URL }}
      NEXA_TURN_URL: ${{ secrets.NEXA_TURN_URL }}
      NEXA_TURN_USERNAME: ${{ secrets.NEXA_TURN_USERNAME }}
      NEXA_TURN_CREDENTIAL: ${{ secrets.NEXA_TURN_CREDENTIAL }}
      KEYSTORE_BASE64: ${{ secrets.NEXA_KEYSTORE_BASE64 }}
      NEXA_STORE_PASSWORD: ${{ secrets.NEXA_STORE_PASSWORD }}
      NEXA_KEY_ALIAS: ${{ secrets.NEXA_KEY_ALIAS }}
      NEXA_KEY_PASSWORD: ${{ secrets.NEXA_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ARCHIVE"
          unzip -tq "$SOURCE_ARCHIVE"
          rm -rf "$RUNNER_TEMP/nexachat-source"
          mkdir -p "$RUNNER_TEMP/nexachat-source"
          unzip -q "$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/nexachat-source"
          SETTINGS="$(find "$RUNNER_TEMP/nexachat-source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f app/build.gradle.kts
          test -f tools/generate_feature_pack.py

      - name: Validate app and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            NEXA_FIREBASE_API_KEY NEXA_DATABASE_URL NEXA_PROJECT_ID NEXA_STORAGE_BUCKET \
            NEXA_FIREBASE_APP_ID NEXA_FIREBASE_SENDER_ID KEYSTORE_BASE64 \
            NEXA_STORE_PASSWORD NEXA_KEY_ALIAS NEXA_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexachat-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$NEXA_STORE_PASSWORD" -alias "$NEXA_KEY_ALIAS" >/dev/null
          echo "NEXA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feature-pack generator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pillow==12.2.0" "numpy==2.3.5"

      - name: Generate useful built-in content
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/generate_feature_pack.py
          python tools/generate_feature_pack.py | tee feature-pack.log
          test "$(find app/src/main/assets/nexa_pack/wallpapers -name 'wallpaper_*.jpg' | wc -l)" -eq 60
          test "$(find app/src/main/assets/nexa_pack/stickers -name 'sticker_*.png' | wc -l)" -eq 180
          test ! -d app/src/main/assets/nexa_pack/sounds
          du -sh app/src/main/assets/nexa_pack

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify-static.sh
          ./tools/verify-static.sh

      - name: Test, lint and build signed release
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build.log

      - name: Verify and rename release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" NexaChat-3.4.1-release.apk
          cp "$AAB" NexaChat-3.4.1-release.aab

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            NexaChat-3.4.1-release.apk | tee signing-report.txt
          jarsigner -verify -verbose -certs NexaChat-3.4.1-release.aab >> signing-report.txt

          sha256sum \
            NexaChat-3.4.1-release.apk \
            NexaChat-3.4.1-release.aab > NexaChat-3.4.1-release.sha256

          SIZE_BYTES="$(stat -c%s NexaChat-3.4.1-release.apk)"
          SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"
          echo "Release APK size: ${SIZE_MIB} MiB" | tee size-report.txt
          test "$SIZE_MIB" -ge 120
          test "$SIZE_MIB" -le 160

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.4.1-Secure-release
          path: |
            NexaChat-3.4.1-release.apk
            NexaChat-3.4.1-release.aab
            NexaChat-3.4.1-release.sha256
            signing-report.txt
            size-report.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.4.1-Secure-reports
          path: |
            build.log
            feature-pack.log
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 14

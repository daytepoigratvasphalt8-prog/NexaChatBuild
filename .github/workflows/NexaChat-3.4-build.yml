name: Build NexaChat 3.4

on:
  workflow_dispatch:
  push:
    paths:
      - "NexaChat-3.4-source.zip"
      - ".github/workflows/NexaChat-3.4-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          test -f NexaChat-3.4-source.zip
          unzip -tq NexaChat-3.4-source.zip
          mkdir -p "$RUNNER_TEMP/nexa"
          unzip -q NexaChat-3.4-source.zip -d "$RUNNER_TEMP/nexa"
          PROJECT="$(dirname "$(find "$RUNNER_TEMP/nexa" -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT"
          cp -a "$PROJECT/." "$GITHUB_WORKSPACE/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify-static.sh
          ./tools/verify-static.sh
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug | tee build.log
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" NexaChat-3.4-debug.apk
          sha256sum NexaChat-3.4-debug.apk > NexaChat-3.4-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.4-APK
          path: |
            NexaChat-3.4-debug.apk
            NexaChat-3.4-debug.apk.sha256
          if-no-files-found: error

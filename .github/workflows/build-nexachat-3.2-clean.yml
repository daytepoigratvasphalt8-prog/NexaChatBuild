name: Build NexaChat 3.2 Clean

on:
  push:
    branches: [main]
    paths:
      - "NexaChat-v3.2-clean-source.zip"
      - ".github/workflows/build-nexachat-3.2-clean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f NexaChat-v3.2-clean-source.zip
          echo "21110242e0bbf53b79359cf9df25eff1a364d34b13a5020da0881ff446de9634  NexaChat-v3.2-clean-source.zip" | sha256sum --check --strict

      - name: Unpack NexaChat 3.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexachat-320
          mkdir -p /tmp/nexachat-320
          unzip -q NexaChat-v3.2-clean-source.zip -d /tmp/nexachat-320
          chmod -R u+rwX,go+rX /tmp/nexachat-320/NexaChat-v3.2-clean
          cp -R /tmp/nexachat-320/NexaChat-v3.2-clean/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          ! grep -R '^import androidx\.compose\.foundation\.layout\.matchParentSize$' app/src/main/java
          ! grep -R '^import androidx\.compose\.foundation\.layout\.weight$' app/src/main/java
          grep -nE 'compileSdk|targetSdk|versionName' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Static verification
        shell: bash
        run: |
          chmod +x gradlew tools/verify-static.sh
          ./tools/verify-static.sh

      - name: Unit tests and APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NexaChat-3.2-Clean-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose NexaChat-3.2-Clean-debug.apk
          sha256sum NexaChat-3.2-Clean-debug.apk | tee NexaChat-3.2-Clean-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.2-Clean-APK
          path: |
            NexaChat-3.2-Clean-debug.apk
            NexaChat-3.2-Clean-debug.apk.sha256
          if-no-files-found: error
          retention-days: 21

      - name: Android lint report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee -a build.log

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-3.2-build-reports
          path: |
            build.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

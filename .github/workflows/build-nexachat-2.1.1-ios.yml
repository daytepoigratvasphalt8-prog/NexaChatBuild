name: Build NexaChat 2.1.1 iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f NexaChat-v2.1.1-ios-source.zip
          echo "ffe4509475d0f51225b076cb222a7259e4ac1c48b788a5dbf895f8db16f64399  NexaChat-v2.1.1-ios-source.zip" | sha256sum --check

      - name: Unpack NexaChat 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexachat-211
          mkdir -p /tmp/nexachat-211
          unzip -q NexaChat-v2.1.1-ios-source.zip -d /tmp/nexachat-211
          cp -a /tmp/nexachat-211/NexaChat-v2.1.1-ios/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -n "suspend fun clearCache" app/src/main/java/com/nexachat/app/core/repository/ChatRepository.kt
          grep -nE 'compileSdk|targetSdk|versionCode|versionName' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Static verification
        run: |
          chmod +x gradlew tools/verify-static.sh
          ./tools/verify-static.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk NexaChat-2.1.1-ios-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-2.1.1-ios-debug-apk
          path: NexaChat-2.1.1-ios-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-2.1.1-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

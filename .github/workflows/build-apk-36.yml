name: Build NexaChat APK 36 (fixed)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f NexaChat-v2-source.zip
          echo "c912b1a379c57925a77e43b44202e3a1d603a249ea12a89c0676cd04bdd93f35  NexaChat-v2-source.zip" | sha256sum --check

      - name: Unpack NexaChat and switch to SDK 36
        run: |
          rm -rf /tmp/nexachat
          mkdir -p /tmp/nexachat
          unzip -q NexaChat-v2-source.zip -d /tmp/nexachat
          cp -a /tmp/nexachat/NexaChat-v2/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          grep -nE 'compileSdk|targetSdk' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
